name: Verify Galaxy Legacy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify JavaScript, structure and Library integrations
        run: npm run verify

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build standalone HTML
        run: python scripts/build-standalone.py

      - name: Package modular project and standalone
        run: |
          mkdir -p package
          git archive HEAD | tar -x -C package
          cp standalone.html package/standalone.html
          (cd package && zip -qr ../Galaxy-Legacy-ChromeOS-v1.0.5.zip .)
          cp standalone.html Galaxy-Legacy-standalone-v1.0.5.html

      - name: Upload standalone and ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Legacy-v1.0.5
          path: |
            Galaxy-Legacy-ChromeOS-v1.0.5.zip
            Galaxy-Legacy-standalone-v1.0.5.html
          if-no-files-found: error
          retention-days: 30
