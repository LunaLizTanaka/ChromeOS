name: Verify Galaxy Legacy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify JavaScript, structure and Internet embeds
        run: npm run verify

      - name: Package Galaxy Legacy v0.5.0
        run: git archive --format=zip --output=Galaxy-Legacy-ChromeOS-v0.5.0.zip HEAD
      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Legacy-ChromeOS-v0.5.0
          path: Galaxy-Legacy-ChromeOS-v0.5.0.zip
          if-no-files-found: error
          retention-days: 14
